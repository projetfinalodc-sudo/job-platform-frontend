<svg width="1600" height="700" viewBox="0 0 1600 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#083f3a"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#083f3a" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#bg)"/>

  <!-- Motif de points discret -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="80" cy="80" r="3"/><circle cx="160" cy="80" r="3"/><circle cx="240" cy="80" r="3"/>
    <circle cx="80" cy="150" r="3"/><circle cx="160" cy="150" r="3"/><circle cx="240" cy="150" r="3"/>
    <circle cx="1360" cy="100" r="3"/><circle cx="1440" cy="100" r="3"/><circle cx="1520" cy="100" r="3"/>
    <circle cx="1360" cy="170" r="3"/><circle cx="1440" cy="170" r="3"/><circle cx="1520" cy="170" r="3"/>
    <circle cx="1360" cy="240" r="3"/><circle cx="1440" cy="240" r="3"/><circle cx="1520" cy="240" r="3"/>
  </g>

  <!-- Cercles décoratifs -->
  <circle cx="1480" cy="130" r="220" fill="#ffffff" opacity="0.04"/>
  <circle cx="90" cy="560" r="160" fill="#ffffff" opacity="0.04"/>
  <circle cx="1250" cy="600" r="90" fill="#ffffff" opacity="0.05"/>

  <!-- Silhouette de skyline stylisée (générique, non liée à un lieu réel précis) -->
  <g fill="#0b5c56" opacity="0.55">
    <rect x="0" y="560" width="70" height="140"/>
    <rect x="80" y="500" width="55" height="200"/>
    <rect x="145" y="540" width="40" height="160"/>
    <rect x="195" y="470" width="65" height="230"/>
    <rect x="270" y="530" width="45" height="170"/>
    <rect x="325" y="490" width="60" height="210"/>
    <polygon points="355,490 385,490 370,455"/>
    <rect x="1200" y="510" width="60" height="190"/>
    <rect x="1270" y="470" width="45" height="230"/>
    <rect x="1325" y="540" width="70" height="160"/>
    <rect x="1405" y="500" width="50" height="200"/>
    <rect x="1465" y="550" width="60" height="150"/>
    <rect x="1535" y="480" width="65" height="220"/>
    <polygon points="1560,480 1600,480 1580,440"/>
  </g>

  <rect width="1600" height="700" fill="url(#fade)"/>
</svg>
